---
- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"
  loop:
    - /opt/monitoring
    - /opt/monitoring/prometheus
    - /opt/monitoring/prometheus/data

- name: Deploy Prometheus config
  ansible.builtin.copy:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: "deus-backend"
          metrics_path: /api/metrics
          static_configs:
            - targets: ["{{ alb_dns_name }}:80"]
          scrape_interval: 10s

        - job_name: "node-exporter"
          static_configs:
            - targets: ["localhost:9100"]
    dest: /opt/monitoring/prometheus/prometheus.yml
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  register: prom_config

- name: Check if Prometheus is running
  ansible.builtin.shell: docker ps -q -f name=prometheus
  register: prom_running
  changed_when: false

- name: Stop Prometheus if config changed
  ansible.builtin.shell: docker rm -f prometheus
  when: prom_config.changed and prom_running.stdout != ""

- name: Run Prometheus container
  ansible.builtin.shell: |
    docker run -d --name prometheus --restart unless-stopped \
      --network host \
      -v /opt/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml \
      -v /opt/monitoring/prometheus/data:/prometheus \
      prom/prometheus:latest \
      --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=7d
  when: prom_config.changed or prom_running.stdout == ""
