[defaults]
inventory = inventory/hosts.ini
roles_path = roles
remote_user = ec2-user
private_key_file = ~/.ssh/vockey.pem
# Learner Lab hosts are ephemeral (new host keys every session); strict checking would break each restart
host_key_checking = False
stdout_callback = default
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes
