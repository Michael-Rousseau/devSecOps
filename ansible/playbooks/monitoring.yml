---
- name: Configure monitoring instance (Prometheus + Grafana)
  hosts: monitoring
  become: true
  vars:
    aws_region: us-east-1
    alb_dns_name: deus-dashboard-alb-1071352964.us-east-1.elb.amazonaws.com
    grafana_admin_password: admin
  roles:
    - docker
    - node-exporter
    - prometheus
    - grafana
